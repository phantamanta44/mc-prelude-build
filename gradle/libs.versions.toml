[versions]
kotlin = "2.3.20"
idea-ext = "1.1.7"
retro-futura-gradle = "2.0.2"
kt-invoke-control-plugin = "2.3.20-0.1.0"

jspecify = "1.0.0"
forgelin = "2.3.20.0"

mixin-booter = "11.0"

kt-invoke-control-lib = "0.1.0"
prelude = "0.0.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }
retro-futura-gradle = { id = "com.gtnewhorizons.retrofuturagradle", version.ref = "retro-futura-gradle" }
kt-invoke-control = { id = "st.evening.kt.invokecontrol", version.ref = "kt-invoke-control-plugin" }

[libraries]
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
forgelin = { group = "io.github.chaosunity.forgelin", name = "Forgelin-Continuous", version.ref = "forgelin" }

mixin-booter = { group = "zone.rong", name = "mixinbooter", version.ref = "mixin-booter" }

kt-invoke-control-lib = { group = "st.evening.kt.invokecontrol", name = "kt-invoke-control-lib", version.ref = "kt-invoke-control-lib" }
prelude = { group = "st.evening.mc.prelude", name = "prelude-1.12.2", version.ref = "prelude" }

[bundles]
downstream = ["jspecify", "kotlin-reflect", "forgelin", "mixin-booter", "kt-invoke-control-lib", "prelude"]
